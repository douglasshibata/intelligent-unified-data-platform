# Apache Casbin PERM Model (Policy, Effect, Request, Matcher)
# Configured for Enterprise Multi-Tenant ABAC/RBAC Policy Enforcement

[request_definition]
r = sub, tenant, obj, act

[policy_definition]
p = sub, tenant, obj, act, eft

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
# Rules:
# 1. Super admin ('role:super_admin') has unrestricted, global clearance on all objects/actions across all tenants.
# 2. Users must be assigned a role matching the policy, must match the requested tenant, must match the resource object, and must match the HTTP/RPC action verb.
m = g(r.sub, "role:super_admin") || (g(r.sub, p.sub) && r.tenant == p.tenant && keyMatch2(r.obj, p.obj) && r.act == p.act)
